[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "comp-psych"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.4.1",
    "scipy>=1.16.3",
    "matplotlib>=3.10.8",
    "pyarrow>=21.0.0",
    "statsmodels>=0.14.6",
    "firebase-admin>=7.5.0",
    "google-cloud-firestore>=2.27.0",
    "google-auth>=2.49.2",
    "cmdstanpy>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["comp_psych*"]